name: Claude Code Review

# Reviews every pull request that touches the site.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      # Skip quietly (no failure email) until the ANTHROPIC_API_KEY secret is added.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Note when the API key is missing
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Skipped - add the ANTHROPIC_API_KEY repository secret to enable Claude."

      - name: Check out the repository
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Review the pull request
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request to the VBloom marketing site. Focus on:
            - Correctness and accessibility of the React components
            - Responsive layout of the dark hero and light content sections, and
              the hero story's quiet paths (pause control, reduced motion, mobile)
            - Content accuracy: flag any claim about the company that is not
              backed by something the maintainers supplied
            Leave inline comments only where there is a concrete problem.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"'
