name: Deploy to OCI VM

# Runs after CI passes on main (or by hand), then rebuilds the site on the VM.
# Needs repository secrets: VM_HOST, VM_USER, VM_SSH_KEY (and optionally
# VM_KNOWN_HOSTS, VM_SITE_URL). Without them the job is skipped rather than failing.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # The first deploy to a 1 GB Micro VM installs Node and builds the site: slow.
    timeout-minutes: 60
    env:
      # Host and user may be repository variables or secrets; the key must be a secret.
      VM_HOST: ${{ vars.VM_HOST || secrets.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || secrets.VM_USER }}
    steps:
      - name: Check deploy settings
        id: check
        env:
          HAS_KEY: ${{ secrets.VM_SSH_KEY != '' }}
        run: |
          [ "$HAS_KEY" = "true" ] || HAS_KEY=""
          if [ -z "$VM_HOST" ] || [ -z "$VM_USER" ] || [ -z "$HAS_KEY" ]; then
            echo "::notice::Deploy skipped: set VM_HOST and VM_USER (variables or secrets) and the VM_SSH_KEY secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # Accept the key as pasted from Windows: PEM text (CRLF or collapsed onto one
          # line) or the whole file base64-encoded.
          key=$(printf '%s' "$VM_SSH_KEY" | tr -d '\r')
          if ! printf '%s' "$key" | grep -q -- '-----BEGIN'; then
            key=$(printf '%s' "$key" | tr -d ' \n\t' | base64 -d | tr -d '\r')
          fi
          header=$(printf '%s' "$key" | grep -o -- '-----BEGIN [A-Z ]*-----' | head -1)
          footer=${header/BEGIN/END}
          body=$(printf '%s' "$key" | tr -d '\n' | sed "s/.*$header//; s/$footer.*//" | tr -d ' \t')
          { echo "$header"; printf '%s' "$body" | fold -w 64; echo; echo "$footer"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::VM_SSH_KEY is not a valid private key. Paste the whole key file, or its base64 encoding (see deploy/oci/README.md)."
            exit 1
          fi
          if [ -n "$VM_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # The VM may still be booting (e.g. right after a reboot): wait up to 5 minutes.
            for attempt in $(seq 1 30); do
              ssh-keyscan -T 10 -H "$VM_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
              echo "SSH on $VM_HOST not answering yet (attempt $attempt/30); retrying in 10s"
              sleep 10
            done
            if [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::Could not reach SSH on $VM_HOST. Check the VM is running and port 22 is open."
              exit 1
            fi
          fi

      - name: Rebuild and restart the site
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # First deploy to a hand-made Oracle Linux VM: run the full setup, which
          # installs vbloom-update; afterwards just update.
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "$VM_USER@$VM_HOST" "DEPLOY_SHA=$DEPLOY_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          if [ -x /usr/local/bin/vbloom-update ]; then
            # Use the update script from the commit being deployed.
            curl -fsSL "https://raw.githubusercontent.com/ssvenkateshs/vbloom/$DEPLOY_SHA/deploy/oci/vbloom-update.sh" \
              | sudo tee /usr/local/bin/vbloom-update > /dev/null
            sudo chmod 755 /usr/local/bin/vbloom-update
            sudo /usr/local/bin/vbloom-update
          elif [ -f /etc/oracle-release ]; then
            curl -fsSL https://raw.githubusercontent.com/ssvenkateshs/vbloom/main/deploy/oci/setup-oracle-linux.sh | sudo bash
          else
            echo "vbloom-update is missing and this is not Oracle Linux; run the stack's setup first." >&2
            exit 1
          fi
          REMOTE

      - name: Check the site responds
        if: steps.check.outputs.ready == 'true'
        env:
          VM_SITE_URL: ${{ vars.VM_SITE_URL || secrets.VM_SITE_URL }}
        run: |
          url="${VM_SITE_URL:-https://${VM_HOST//./-}.sslip.io}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            echo "$url -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Site did not return 200 after the deploy." && exit 1

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - name: Open the site in a browser
        if: steps.check.outputs.ready == 'true'
        env:
          VM_SITE_URL: ${{ vars.VM_SITE_URL || secrets.VM_SITE_URL }}
        run: |
          url="${VM_SITE_URL:-https://${VM_HOST//./-}.sslip.io}"
          mkdir -p site-check
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node deploy/check/site-check.mjs "$url" site-check

      - name: Upload screenshots
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site-check/
          if-no-files-found: ignore
